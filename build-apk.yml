name: Build CoolerBT APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          curl -L "${{ github.server_url }}/${{ github.repository }}/raw/${{ github.ref_name }}/CoolerBT_GitHubReady_FIXED.zip" -o project.zip
          rm -rf project
          mkdir project
          unzip -o project.zip -d project

          if [ -d "project/CoolerBT" ]; then
            cp -a project/CoolerBT/. .
          else
            cp -a project/. .
          fi

          echo "Project structure:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.0.2
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.0.2"
          validate-wrappers: false

      - name: Verify environment
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la

      - name: Build debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Show APK files
        shell: bash
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CoolerBT-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
